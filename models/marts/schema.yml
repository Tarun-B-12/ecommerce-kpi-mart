version: 2

models:
  - name: mart_revenue_summary
    description: "Daily revenue KPIs built from delivered and non-canceled orders. Includes order volume, gross revenue, avg order value, delivery performance, and payment method mix. One row per order date."
    columns:
      - name: order_date
        description: "Date the order was placed."
        tests:
          - not_null
          - unique
      - name: total_orders
        description: "Total number of non-canceled orders placed on this date."
        tests:
          - not_null
      - name: gross_revenue
        description: "Sum of item prices for all orders on this date, excluding freight."
        tests:
          - not_null
      - name: avg_order_value
        description: "Average order value for this date."
        tests:
          - not_null

  - name: mart_customer_segments
    description: "Customer-level KPIs and segmentation. Includes revenue tier, order history, delivery experience, and late delivery rate. One row per unique customer."
    columns:
      - name: customer_unique_id
        description: "Primary key. True unique customer identifier."
        tests:
          - not_null
          - unique
      - name: customer_segment
        description: "Segment based on delivered order count."
        tests:
          - not_null
      - name: revenue_tier
        description: "Revenue tier based on total spend: High Value, Mid Value, or Low Value."
        tests:
          - not_null

  - name: mart_seller_performance
    description: "Seller-level KPIs covering revenue, items sold, delivery performance, and avg review score. One row per seller."
    columns:
      - name: seller_id
        description: "Primary key. Unique seller identifier."
        tests:
          - not_null
          - unique
      - name: total_orders
        description: "Total number of delivered orders fulfilled by this seller."
        tests:
          - not_null
      - name: total_revenue
        description: "Total item revenue generated by this seller."
        tests:
          - not_null
      - name: avg_review_score
        description: "Average customer review score across all delivered orders."